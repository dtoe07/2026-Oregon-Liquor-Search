
name: Oregon Liquor Inventory Bot

on:
  schedule:
    # GitHub Actions cron uses UTC. Avoid minute 0, which is often delayed.
    - cron: "7 14 * * *" # 7:07 AM Oregon (PDT)

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcc-inventory-bot
  cancel-in-progress: false

jobs:
  check-inventory:
    name: Check ZIP ${{ matrix.zip_code }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - zip_code: "97015"
            radius: "30"
            delay_seconds: 0
          - zip_code: "97223"
            radius: "30"
            delay_seconds: 300

    env:
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      ADDR_TO_97015: ${{ secrets.ADDR_TO_97015 }}
      ADDR_TO_97223: ${{ secrets.ADDR_TO_97223 }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Restore previously saved store coordinates
      - name: Restore geocoding cache
        uses: actions/cache/restore@v4
        with:
          path: data/geocode_cache.json
          key: geocoding-${{ runner.os }}-${{ matrix.zip_code }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geocoding-${{ runner.os }}-${{ matrix.zip_code }}-

      # Download OLCC inventory, check stock, and send email
      - name: Run OLCC inventory bot
        run: |
          sleep "${{ matrix.delay_seconds }}"
          python main.py "${{ matrix.zip_code }}" "${{ matrix.radius }}"

      # Save coordinates for future workflow runs
      - name: Save geocoding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/geocode_cache.json
          key: geocoding-${{ runner.os }}-${{ matrix.zip_code }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Downloadable copy of the geocoding cache
      - name: Upload geocoding cache for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocode-cache-${{ matrix.zip_code }}
          path: data/geocode_cache.json
          if-no-files-found: warn
          retention-days: 7

      # Downloadable execution logs and email preview
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-results-${{ matrix.zip_code }}
          path: |
            logfile.txt
            last_email.txt
          if-no-files-found: ignore
          retention-days: 7
